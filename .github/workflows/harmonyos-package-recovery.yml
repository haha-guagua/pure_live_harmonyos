name: HarmonyOS package recovery
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published HarmonyOS preview tag to archive without rebuilding
        required: true
        type: string
      recover_release:
        description: Upload the verified local build and recover its Release first
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: harmonyos-package-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  stage:
    if: inputs.recover_release && github.repository == 'haha-guagua/pure_live_harmonyos' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, pure-live-ohos]
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Verify the retained local build without executing app code
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-ohos\.[1-9]\d*$') { throw 'Invalid version tag.' }
          $root = 'E:\pl-ci\pure_live_harmonyos\pure_live_harmonyos\local-artifacts\release'
          $metadata = Get-Content (Join-Path $root 'build-metadata.json') -Raw | ConvertFrom-Json
          $revision = & gh api "repos/$env:GH_REPO/commits/$env:RELEASE_TAG" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the immutable tag commit.' }
          if ($metadata.tag -ne $env:RELEASE_TAG -or $metadata.commit -ne $revision) { throw 'Retained build provenance mismatch.' }
          $expected = @("PureLive-$env:RELEASE_TAG-harmonyos-arm64-debug-device-signed.hap", "PureLive-$env:RELEASE_TAG-harmonyos-arm64-debug-unsigned.hap")
          if (@($metadata.assets).Count -ne 2) { throw 'Expected exactly two HAPs.' }
          foreach ($asset in $metadata.assets) {
            if ($asset.asset -notin $expected) { throw 'Unexpected HAP filename.' }
            $file = Join-Path $root $asset.asset
            if ((Get-Item $file).Length -ne $asset.bytes -or (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $asset.sha256) { throw 'Retained HAP hash/size mismatch.' }
          }
          $allowed = $expected + @('SHA256SUMS.txt', 'build-metadata.json', 'INSTALLATION.md', 'RELEASE_NOTES.md')
          $actual = @(Get-ChildItem $root -File | ForEach-Object Name)
          if (Compare-Object $allowed $actual) { throw 'Unexpected or missing retained release files.' }
          Write-Output 'Retained build provenance and hashes verified; no rebuild or signing configuration accessed.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: first_upload
        continue-on-error: true
        with:
          name: harmonyos-release
          path: E:/pl-ci/pure_live_harmonyos/pure_live_harmonyos/local-artifacts/release/*
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.first_upload.outcome == 'failure'
        with:
          name: harmonyos-release
          path: E:/pl-ci/pure_live_harmonyos/pure_live_harmonyos/local-artifacts/release/*
          retention-days: 7
          if-no-files-found: error
          overwrite: true
  publish:
    needs: stage
    if: inputs.recover_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harmonyos-release
          path: release
      - name: Resume only the matching draft, preserving complete assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          tag, repo = os.environ['RELEASE_TAG'], os.environ['GH_REPO']
          def gh(*args):
              return subprocess.check_output(['gh', *args], text=True).strip()
          root = Path('release')
          meta = json.loads((root / 'build-metadata.json').read_text())
          assert meta['tag'] == tag
          assert meta['commit'] == gh('api', f'repos/{repo}/commits/{tag}', '--jq', '.sha')
          names = {a['asset'] for a in meta['assets']} | {'SHA256SUMS.txt', 'build-metadata.json', 'INSTALLATION.md'}
          expected = {}
          for name in names:
              path = root / name
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              expected[name] = ('sha256:' + digest, path.stat().st_size)
          for asset in meta['assets']:
              assert expected[asset['asset']] == ('sha256:' + asset['sha256'], asset['bytes'])
          inventory = json.loads(gh('api', f'repos/{repo}/releases?per_page=100'))
          matches = [r for r in inventory if r['tag_name'] == tag]
          if not matches:
              gh('release', 'create', tag, '--verify-tag', '--draft', '--prerelease', '--title', f'Pure Live HarmonyOS {tag}', '--notes-file', str(root / 'RELEASE_NOTES.md'))
          inventory = json.loads(gh('api', f'repos/{repo}/releases?per_page=100'))
          matching = [r for r in inventory if r['tag_name'] == tag]
          assert len(matching) == 1, 'Expected exactly one matching release.'
          release_id = matching[0]['id']
          def release():
              return json.loads(gh('api', f'repos/{repo}/releases/{release_id}'))
          current = release()
          complete = set()
          for asset in current['assets']:
              assert asset['name'] in expected, 'Unexpected asset; refusing mutation.'
              if asset['state'] == 'uploaded':
                  assert (asset['digest'], asset['size']) == expected[asset['name']], 'Existing asset differs; refusing replacement.'
                  complete.add(asset['name'])
              else:
                  assert current['draft'] and asset['state'] == 'starter', 'Only unfinished draft upload placeholders may be removed.'
                  gh('api', '--method', 'DELETE', f"repos/{repo}/releases/assets/{asset['id']}")
          missing = names - complete
          if missing:
              assert current['draft'], 'Published assets must not be silently changed.'
              gh('release', 'upload', tag, *[str(root / n) for n in sorted(missing)])
          current = release()
          assert {a['name'] for a in current['assets']} == names
          for asset in current['assets']:
              assert asset['state'] == 'uploaded'
              assert (asset['digest'], asset['size']) == expected[asset['name']]
          if current['draft']:
              gh('release', 'edit', tag, '--draft=false', '--prerelease')
          print('Published matching verified assets without rebuilding or replacing completed uploads.')
          PY
  packages:
    needs: [stage, publish]
    if: always() && github.repository == 'haha-guagua/pure_live_harmonyos' && github.actor == github.repository_owner && (!inputs.recover_release || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download and validate the published installation assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-ohos\.[1-9][0-9]*$ ]] || exit 1
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" == false ]]
          mkdir bundle
          gh release download "$RELEASE_TAG" --dir bundle \
            --pattern "PureLive-$RELEASE_TAG-harmonyos-arm64-debug-*.hap" \
            --pattern SHA256SUMS.txt --pattern build-metadata.json --pattern INSTALLATION.md
          gh release view "$RELEASE_TAG" --json body --jq .body > bundle/RELEASE_NOTES.md
          gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha > revision.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('bundle')
          metadata = json.loads((root / 'build-metadata.json').read_text())
          tag = os.environ['RELEASE_TAG']
          assert metadata['tag'] == tag
          assert metadata['commit'] == Path('revision.txt').read_text().strip()
          expected = {
              f'PureLive-{tag}-harmonyos-arm64-debug-device-signed.hap': 'device-bound-debug',
              f'PureLive-{tag}-harmonyos-arm64-debug-unsigned.hap': 'unsigned',
          }
          assert {a['asset']: a['signing'] for a in metadata['assets']} == expected
          assert {p.name for p in root.glob('*.hap')} == set(expected)
          sums = (root / 'SHA256SUMS.txt').read_text()
          for asset in metadata['assets']:
              path = root / asset['asset']
              assert path.stat().st_size == asset['bytes']
              with path.open('rb') as stream:
                  digest = hashlib.file_digest(stream, 'sha256').hexdigest()
              assert digest == asset['sha256']
              assert f"{digest}  {path.name}" in sums.splitlines()
          print('Published HAP hashes, sizes and tag commit verified.')
          PY
      - name: Archive the verified release in GHCR
        shell: bash
        run: |
          set -euo pipefail
          registry_path="ghcr.io/${GH_REPO,,}"
          revision="$(cat revision.txt)"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          if existing_manifest="$(docker manifest inspect "$registry_path:$RELEASE_TAG" 2>&1)"; then
            echo 'Package version already exists; refusing to replace it.'
            exit 1
          else
            if [[ "$existing_manifest" != *'manifest unknown'* && "$existing_manifest" != *'no such manifest'* ]]; then
              echo 'Could not confirm that the package version is absent.'
              exit 1
            fi
          fi
          printf 'FROM scratch\nCOPY . /release/\n' > /tmp/pure-live-package.Dockerfile
          docker build --file /tmp/pure-live-package.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GH_REPO" \
            --label "org.opencontainers.image.revision=$revision" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.description=HarmonyOS installation assets; archive only, not a runnable app" \
            --tag "$registry_path:$RELEASE_TAG" bundle
          docker push "$registry_path:$RELEASE_TAG"
