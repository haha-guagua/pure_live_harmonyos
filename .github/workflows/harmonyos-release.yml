name: HarmonyOS preview release
on:
  push:
    tags: ['v*-ohos.*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: harmonyos-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    # Only the repository owner may dispatch/tag trusted local builds.
    if: github.repository == 'haha-guagua/pure_live_harmonyos' && github.actor == github.repository_owner
    runs-on: [self-hosted, Windows, X64, pure-live-ohos]
    timeout-minutes: 60
    steps:
      - name: Require a version tag
        shell: powershell
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v\d+\.\d+\.\d+-ohos\.[1-9]\d*$') {
            throw 'Run on a version tag such as v3.1.19-ohos.1.'
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate release tooling
        shell: powershell
        run: |
          if (-not (Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Version release notes missing.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already merged into main.' }
          python -m unittest discover -s test/tool -p 'test_harmonyos_release.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release tooling tests failed.' }
      - name: Build and verify device-signed Debug HAP
        shell: powershell
        run: .\tool\build_harmonyos_ci.ps1
      - name: Prepare validated release assets
        shell: powershell
        run: |
          python tool/prepare_harmonyos_release.py --tag "$env:GITHUB_REF_NAME" `
            --hap build/ohos/hap/entry-default-signed.hap `
            --unsigned-hap build/ohos/hap/entry-default-unsigned.hap --output local-artifacts/release
          if ($LASTEXITCODE -ne 0) { throw 'Release asset validation failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harmonyos-release
          path: local-artifacts/release/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harmonyos-release
          path: release
      - name: Publish complete preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Never overwrite an existing published version or quietly replace its assets.
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
            --title "Pure Live HarmonyOS $RELEASE_TAG" --notes-file release/RELEASE_NOTES.md \
            release/*.hap release/SHA256SUMS.txt release/build-metadata.json release/INSTALLATION.md
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
  packages:
    needs: [build, publish]
    if: vars.PUBLISH_GHCR == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harmonyos-release
          path: bundle
      - name: Archive installation assets in private GHCR package
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          REVISION: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          registry_path="ghcr.io/${REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          printf 'FROM scratch\nCOPY . /release/\n' > /tmp/pure-live-package.Dockerfile
          docker build --file /tmp/pure-live-package.Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$REVISION" \
            --label "org.opencontainers.image.version=$RELEASE_TAG" \
            --label "org.opencontainers.image.description=HarmonyOS installation assets; archive only, not a runnable app" \
            --tag "$registry_path:$RELEASE_TAG" bundle
          docker push "$registry_path:$RELEASE_TAG"
